title: Fun Reminder - Account Banned After Abuse Strikes
id: 6f0d5d2a-1b7e-4c11-9a1a-0e5a1f000002
status: experimental
description: An account reached the strike limit and was banned (temporary or permanent), for injection or repeated off-topic use.
author: Quang Minh Le
date: 2026-11-10
tags:
  - attack.initial_access
logsource:
  product: funreminder
  service: security
detection:
  selection:
    event.dataset: funreminder.security
    event.action: user_banned
  condition: selection
falsepositives:
