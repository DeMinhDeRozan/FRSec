title: Fun Reminder - Sweeper Run Had Failures
id: 6f0d5d2a-1b7e-4c11-9a1a-0e5a1f000009
status: experimental
description: A sweeper run finished with failures (SNS publish or DynamoDB update error). Operational rule, no MITRE mapping.
author: Quang Minh Le
